# Déploiement sur GitHub Pages (équivalent de .gitlab-ci.yml)
#
#   tests      moteur Python (CPython) et interface (TypeScript)
#   build      téléchargement de Pyodide, test du moteur dans Pyodide, construction
#   deploy     publication sur GitHub Pages (branche main uniquement)
#
# Prérequis : Settings > Pages > Source = « GitHub Actions ». Aucun secret nécessaire.
# Le site est servi sous https://<utilisateur>.github.io/<dépôt>/ (chemins relatifs).

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # même version que Pyodide (pyodide.config.json)
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - run: pip install -r engine/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: engine

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build:
    needs: [test-engine, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Pyodide (≈ 57 Mo)
        uses: actions/cache@v4
        with:
          path: static/pyodide
          key: pyodide-${{ hashFiles('pyodide.config.json') }}
      - run: npm run setup
      - run: npm run test:pyodide
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
